<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nexus</title><desc id="desc">A geometric dark cube with a clean neon-green N and orbiting energy rings.</desc>
<defs>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163d24"/><stop offset="1" stop-color="#050d08"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102719"/><stop offset="1" stop-color="#020705"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ff8c"/><stop offset=".48" stop-color="#39ff14"/><stop offset="1" stop-color="#00a83b"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="800" rx="96" fill="#030704"/>
<g fill="none" stroke="#26ff43" stroke-width="5" opacity=".82" filter="url(#glow)"><ellipse cx="400" cy="405" rx="330" ry="115" transform="rotate(-28 400 405)"/><ellipse cx="400" cy="405" rx="330" ry="115" transform="rotate(28 400 405)"/></g>
<g stroke="url(#edge)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"><path d="M400 120 620 245 400 370 180 245Z" fill="#102b18"/><path d="M180 245 400 370 400 650 180 520Z" fill="url(#face)"/><path d="M620 245 400 370 400 650 620 520Z" fill="url(#side)"/></g>
<g opacity=".38" fill="#20ff50"><path d="M220 270 260 293 260 345 220 322Z"/><path d="M275 301 315 324 315 376 275 353Z"/><path d="M580 270 540 293 540 345 580 322Z"/><path d="M525 301 485 324 485 376 525 353Z"/><path d="M220 365 260 388 260 440 220 417Z"/><path d="M580 365 540 388 540 440 580 417Z"/></g>
<!-- A deliberately simple, symmetrical block N: two vertical stems and one diagonal. -->
<path d="M280 535V365H337L463 495V365H520V535H463L337 405V535Z" fill="#020604" stroke="#06190b" stroke-width="15" stroke-linejoin="miter"/>
<path d="M290 525V375H333L467 515V375H510V525H467L333 385V525Z" fill="url(#edge)" stroke="#baff77" stroke-width="5" stroke-linejoin="miter" filter="url(#glow)"/>
<path d="M309 506V394H325L486 507V394H491V516H484L314 397V506Z" fill="#07170b" opacity=".62"/>
<g fill="#52ff3c" opacity=".95"><rect x="122" y="275" width="18" height="18" transform="rotate(25 131 284)"/><rect x="648" y="300" width="15" height="15" transform="rotate(25 655 307)"/><rect x="165" y="578" width="12" height="12" transform="rotate(25 171 584)"/><rect x="623" y="567" width="20" height="20" transform="rotate(25 633 577)"/><rect x="393" y="82" width="14" height="14"/></g>
</svg>