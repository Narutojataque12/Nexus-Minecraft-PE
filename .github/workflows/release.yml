name: Publish Nexus Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package release files
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ENGINE_FILE="engine/Nexus_V${VERSION}.js"
          NOTES_FILE="releases/V${VERSION}/README.md"

          test -f "$ENGINE_FILE" || { echo "Engine file not found: $ENGINE_FILE"; exit 1; }
          test -f "$NOTES_FILE" || { echo "Release notes not found: $NOTES_FILE"; exit 1; }

          mkdir -p dist
          cp "$ENGINE_FILE" "dist/Nexus_V${VERSION}.js"
          cp LICENSE dist/LICENSE
          cp "$NOTES_FILE" dist/RELEASE_NOTES.md
          cd dist
          zip "Nexus-V${VERSION}.zip" "Nexus_V${VERSION}.js" LICENSE RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus V${{ steps.meta.outputs.version }}
          body_path: releases/V${{ steps.meta.outputs.version }}/README.md
          files: |
            dist/Nexus_V${{ steps.meta.outputs.version }}.js
            dist/Nexus-V${{ steps.meta.outputs.version }}.zip
